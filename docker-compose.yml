services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: so-tags-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DatabasePath: /data/tags.db
    volumes:
      - db-data:/data
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/openapi/v1.json || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: so-tags-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-net

volumes:
  db-data:

networks:
  app-net:
    driver: bridge
